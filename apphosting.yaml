# Firebase App Hosting config
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
  # Long-running streaming responses need a generous timeout.
  timeoutSeconds: 300

env:
  # Public Firebase config — safe to ship to the browser.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyA8e8dtdrV1eG1XfQo3IvbtT-YK47y8Snk
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: compai-57d55.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: compai-57d55
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: compai-57d55.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: '510729543987'
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: '1:510729543987:web:a6f04b45e6a1af2de7de46'
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-HX2FX3VY9C
    availability: [BUILD, RUNTIME]

  # SECRETS — set via:
  #   firebase apphosting:secrets:set ANTHROPIC_API_KEY
  #   firebase apphosting:secrets:set FIREBASE_ADMIN_CREDENTIALS
  #   firebase apphosting:secrets:set ELEVENLABS_API_KEY   (used by
  #     /api/transcribe for accurate Indian-English speech-to-text via
  #     ElevenLabs Scribe. If not set, the mic falls back to the browser's
  #     built-in engine.)
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability: [RUNTIME]
  - variable: FIREBASE_ADMIN_CREDENTIALS
    secret: FIREBASE_ADMIN_CREDENTIALS
    availability: [RUNTIME]
  - variable: ELEVENLABS_API_KEY
    secret: ELEVENLABS_API_KEY
    availability: [RUNTIME]
  # Sarvam Saarika — primary speech-to-text for the interview/discovery mics
  # (Indian-English accuracy + where we have credits). ElevenLabs above is the
  # fallback used only when this is unset. Grant access before deploying:
  #   firebase apphosting:secrets:grantaccess SARVAM_API_KEY --backend compai-web
  - variable: SARVAM_API_KEY
    secret: SARVAM_API_KEY
    availability: [RUNTIME]

  # WhatsApp (Meta Cloud API) — Rhai over WhatsApp (/api/whatsapp).
  #   firebase apphosting:secrets:set WHATSAPP_TOKEN        (permanent access token)
  #   firebase apphosting:secrets:set WHATSAPP_APP_SECRET   (app secret, signs webhooks)
  - variable: WHATSAPP_TOKEN
    secret: WHATSAPP_TOKEN
    availability: [RUNTIME]
  - variable: WHATSAPP_APP_SECRET
    secret: WHATSAPP_APP_SECRET
    availability: [RUNTIME]
  # Non-secret config. VERIFY_TOKEN is the handshake string set in Meta's
  # webhook config; ALLOWED_NUMBERS is the default-closed sender allowlist.
  - variable: WHATSAPP_PHONE_NUMBER_ID
    value: '118004977902377'
    availability: [RUNTIME]
  - variable: WHATSAPP_VERIFY_TOKEN
    value: 8e562e9266f938e02a8cd39fd9fcc03f
    availability: [RUNTIME]
  - variable: WHATSAPP_ALLOWED_NUMBERS
    value: '919886750009'
    availability: [RUNTIME]

  # Rhai pipelines — Fireflies ingestion, cron auth, server-side Google
  # Calendar (WhatsApp scheduling + pre-call briefings).
  #   firebase apphosting:secrets:set FIREFLIES_API_KEY
  #   firebase apphosting:secrets:set CRON_SECRET          (same value as the
  #     functions secret — the scheduler in functions/rhai-cron.js sends it)
  #   firebase apphosting:secrets:set GOOGLE_OAUTH_CLIENT_ID
  #   firebase apphosting:secrets:set GOOGLE_OAUTH_CLIENT_SECRET
  #   firebase apphosting:secrets:set GOOGLE_OAUTH_REFRESH_TOKEN  (mint once
  #     with: npx tsx scripts/get-google-refresh-token.ts)
  - variable: FIREFLIES_API_KEY
    secret: FIREFLIES_API_KEY
    availability: [RUNTIME]
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability: [RUNTIME]
  - variable: GOOGLE_OAUTH_CLIENT_ID
    secret: GOOGLE_OAUTH_CLIENT_ID
    availability: [RUNTIME]
  - variable: GOOGLE_OAUTH_CLIENT_SECRET
    secret: GOOGLE_OAUTH_CLIENT_SECRET
    availability: [RUNTIME]
  - variable: GOOGLE_OAUTH_REFRESH_TOKEN
    secret: GOOGLE_OAUTH_REFRESH_TOKEN
    availability: [RUNTIME]
  # Group chat (optional — omit entirely to keep groups off). Add these two
  # back with real values when the Groups API is set up:
  #   WHATSAPP_ALLOWED_GROUPS   comma-separated allowlist of group ids Rhai will
  #     engage in at all. Unset or empty = every group is ignored (default-closed).
  #   WHATSAPP_TEAM_GROUP_ID    the group that gets the day-before "car needed"
  #     call-out. Unset = no call-out is sent.
  # Groups need an Official Business Account, are created via Meta's Groups API,
  # and cap at 8 participants.
  # Where pre-call briefings are sent (falls back to WHATSAPP_ALLOWED_NUMBERS).
  - variable: WHATSAPP_BRIEFING_TO
    value: '919886750009'
    availability: [RUNTIME]
  # Optional: a pre-approved WhatsApp template (WhatsApp Manager → Message
  # Templates, category UTILITY) that pings Rhea when a check-in comes in — this
  # is the ONLY reliable way to deliver outside the 24h session window. Suggested
  # body with 3 variables: "New {{1}} check-in from {{2}} ({{3}}). Open the
  # dashboard to read it." Set the approved template's name here to switch it on.
  - variable: WHATSAPP_CHECKIN_TEMPLATE
    value: ''
    availability: [RUNTIME]

  # Rhai MCP server (/api/mcp/<token>) — claude.ai custom connector into the
  # dashboard. The token IS the credential (capability URL); mint with
  # `openssl rand -hex 32`, then:
  #   firebase apphosting:secrets:set RHAI_MCP_TOKEN
  # Rotate the secret to revoke every connected client at once.
  - variable: RHAI_MCP_TOKEN
    secret: RHAI_MCP_TOKEN
    availability: [RUNTIME]
